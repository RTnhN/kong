<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kong</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: #fff;
      color: #222;
    }
    #text, #reading {
      flex: 1;
      padding: 5rem clamp(1.25rem, 5vw, 5rem) 3rem;
      border: 0;
      outline: none;
      font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: clamp(1.125rem, 2vw, 1.5rem);
      line-height: 1.8;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    [hidden] { display: none !important; }
    #reading { white-space: normal; }
    #reading p { white-space: pre-wrap; }
    #reading > :first-child { margin-top: 0; }
    #reading h1, #reading h2, #reading h3,
    #reading h4, #reading h5, #reading h6 { line-height: 1.3; }
    #reading blockquote { margin-left: 0; padding-left: 1rem; border-left: 3px solid #ddd; color: #666; }
    #reading pre { overflow-x: auto; padding: 1rem; background: #f5f5f5; white-space: pre; }
    #reading code { font-size: .85em; background: #f5f5f5; border-radius: .2rem; }
    #reading a { color: #245c91; }
    #mode {
      position: fixed;
      top: 1rem;
      right: 1rem;
      padding: .45rem .85rem;
      border: 1px solid #ddd;
      border-radius: .4rem;
      background: #fff;
      color: #444;
      font:  .875rem system-ui, sans-serif;
      cursor: pointer;
    }
    #mode:hover { background: #f5f5f5; }
    #mode:focus-visible { outline: 2px solid #555; outline-offset: 3px; }
    footer {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: .5rem 1.25rem;
      padding: 1rem 1.25rem;
      color: #777;
      font: 1rem system-ui, sans-serif;
    }
    footer a { color: inherit; text-underline-offset: .2em; }
    footer a:hover { color: #222; }
  </style>
</head>
<body>
  <button id="mode" type="button" aria-pressed="false" title="Current mode: Read. Click to toggle; hold Ctrl to edit, or use Ctrl+A to stay in Edit.">Read</button>
  <main id="text" hidden contenteditable="false" role="textbox" aria-label="Markdown text" aria-multiline="true" aria-readonly="true" spellcheck="false"></main>
  <main id="reading" aria-label="Rendered text"></main>
  <footer>
    <a href="https://github.com/RTnhN/kong" target="_blank" rel="noopener noreferrer">GitHub</a>
    <span>Made with <span id="object-emoji" role="img" aria-label="a kite">🪁</span> in <span id="place-emoji" role="img" aria-label="the United States">🇺🇸</span></span>
  </footer>
  <script src="markdown.js"></script>
  <script>
    'use strict';
    const editor = document.getElementById('text');
    const reading = document.getElementById('reading');
    const button = document.getElementById('mode');
    const storageKey = 'kong.text';
    let editing = false;
    let ctrlHeld = false;
    let keepEditingOnRelease = false;
    let sourceText = '';

    const objects = [
      ['🪁', 'a kite'], ['🧸', 'a teddy bear'], ['🎸', 'a guitar'],
      ['📚', 'books'], ['🧩', 'a puzzle piece'], ['🔭', 'a telescope'],
      ['🖌️', 'a paintbrush'], ['💡', 'a light bulb'], ['🧶', 'yarn'],
      ['☂️', 'an umbrella'], ['🛠️', 'tools'], ['📷', 'a camera'],
      ['🚽', 'a toilet'], ['☕', 'a cup of coffee'], ['🥢', 'chopsticks'],
      ['🪠', 'a plunger'], ['🧻', 'a roll of toilet paper'], ['🧽', 'a sponge'],
      ['🪥', 'a toothbrush'], ['🧼', 'soap'], ['🛁', 'a bathtub'],
      ['🪣', 'a bucket'], ['🧹', 'a broom'], ['🧴', 'a lotion bottle'],
      ['🦷', 'a tooth'], ['🦴', 'a bone'], ['🧠', 'a brain'],
      ['🦠', 'a microbe'], ['🧬', 'DNA'], ['🧪', 'a test tube'],
      ['🧫', 'a petri dish'], ['🔬', 'a microscope'], ['⚗️', 'an alembic'],
      ['🧲', 'a magnet'], ['🧯', 'a fire extinguisher'], ['🪤', 'a mouse trap'],
      ['🧱', 'a brick'], ['🪜', 'a ladder'], ['🪚', 'a saw'],
      ['🔩', 'a nut and bolt'], ['🪛', 'a screwdriver'], ['🔧', 'a wrench'],
      ['⚙️', 'a gear'], ['⛓️', 'chains'], ['🪝', 'a hook'],
      ['🧵', 'thread'], ['🪡', 'a sewing needle'], ['🧷', 'a safety pin'],
      ['✂️', 'scissors'], ['📎', 'a paperclip'], ['📏', 'a ruler'],
      ['🖇️', 'linked paperclips'], ['🗜️', 'a clamp'], ['🗑️', 'a wastebasket'],
      ['🪑', 'a chair'], ['🛋️', 'a couch'], ['🛏️', 'a bed'],
      ['🪞', 'a mirror'], ['🪟', 'a window'], ['🚪', 'a door'],
      ['🗝️', 'an old key'], ['🔒', 'a lock'], ['🧳', 'a suitcase'],
      ['🛒', 'a shopping cart'], ['📦', 'a package'], ['📫', 'a mailbox'],
      ['📠', 'a fax machine'], ['📟', 'a pager'], ['☎️', 'a telephone'],
      ['💾', 'a floppy disk'], ['💿', 'a CD'], ['📼', 'a videotape'],
      ['📺', 'a television'], ['📻', 'a radio'], ['🕹️', 'a joystick'],
      ['🔋', 'a battery'], ['🔌', 'a plug'], ['🛰️', 'a satellite'],
      ['🚀', 'a rocket'], ['🛸', 'a flying saucer'], ['🛶', 'a canoe'],
      ['🛼', 'a roller skate'], ['🛹', 'a skateboard'], ['🛷', 'a sled'],
      ['🛟', 'a life ring'], ['⚓', 'an anchor'], ['🧭', 'a compass'],
      ['🪐', 'a ringed planet'], ['🪨', 'a rock'], ['🪵', 'a log'],
      ['🪸', 'coral'], ['🐚', 'a seashell'], ['🪶', 'a feather'],
      ['🍄', 'a mushroom'], ['🌵', 'a cactus'], ['🥔', 'a potato'],
      ['🥒', 'a cucumber'], ['🍆', 'an eggplant'], ['🧄', 'garlic'],
      ['🧅', 'an onion'], ['🥥', 'a coconut'], ['🍍', 'a pineapple'],
      ['🧀', 'cheese'], ['🥨', 'a pretzel'], ['🧇', 'a waffle'],
      ['🥟', 'a dumpling'], ['🍣', 'sushi'], ['🍜', 'noodles'],
      ['🌮', 'a taco'], ['🍕', 'pizza'], ['🍿', 'popcorn'],
      ['🍩', 'a doughnut'], ['🍪', 'a cookie'], ['🥠', 'a fortune cookie'],
      ['🧋', 'bubble tea'], ['🫖', 'a teapot'], ['🧃', 'a juice box'],
      ['🧊', 'an ice cube'], ['🧂', 'salt'], ['🥄', 'a spoon'],
      ['🍴', 'a fork and knife'], ['🥣', 'a bowl'], ['🫙', 'a jar'],
      ['🍼', 'a baby bottle'], ['🎈', 'a balloon'], ['🪅', 'a piñata'],
      ['🪩', 'a disco ball'], ['🎊', 'confetti'], ['🎁', 'a gift'],
      ['🎲', 'a die'], ['🎱', 'a pool ball'], ['🪀', 'a yo-yo'],
      ['🃏', 'a joker card'], ['🀄', 'a mahjong tile'], ['♟️', 'a chess pawn'],
      ['🪄', 'a magic wand'], ['🔮', 'a crystal ball'], ['🧿', 'a nazar amulet'],
      ['🪬', 'a hamsa'], ['🗿', 'a moai statue'], ['🎃', 'a jack-o-lantern'],
      ['🎭', 'theater masks'], ['👑', 'a crown'], ['🎩', 'a top hat'],
      ['🩴', 'a flip-flop'], ['🧦', 'socks'], ['🥽', 'goggles'],
      ['🪖', 'a helmet'], ['🪭', 'a folding fan'], ['🪮', 'a hair pick'],
      ['🪗', 'an accordion'], ['🪕', 'a banjo'], ['🪘', 'a drum'],
      ['🎺', 'a trumpet'], ['🎷', 'a saxophone'], ['🎻', 'a violin'],
      ['🛎️', 'a bell'], ['📯', 'a postal horn'], ['⏰', 'an alarm clock'],
      ['⌛', 'an hourglass'], ['⚖️', 'a balance scale'], ['🕯️', 'a candle'],
      ['🪔', 'an oil lamp'], ['🏺', 'an amphora'], ['⚱️', 'an urn'],
      ['⚰️', 'a coffin'], ['🪦', 'a headstone'], ['🧨', 'a firecracker']
    ];
    const countries = [
      ['🇺🇸', 'the United States'], ['🇨🇦', 'Canada'], ['🇲🇽', 'Mexico'],
      ['🇧🇷', 'Brazil'], ['🇦🇷', 'Argentina'], ['🇬🇧', 'the United Kingdom'],
      ['🇫🇷', 'France'], ['🇩🇪', 'Germany'], ['🇮🇹', 'Italy'],
      ['🇪🇸', 'Spain'], ['🇸🇪', 'Sweden'], ['🇬🇷', 'Greece'],
      ['🇯🇵', 'Japan'], ['🇨🇳', 'China'], ['🇰🇷', 'South Korea'],
      ['🇮🇳', 'India'], ['🇹🇭', 'Thailand'], ['🇻🇳', 'Vietnam'],
      ['🇰🇪', 'Kenya'], ['🇿🇦', 'South Africa'], ['🇪🇬', 'Egypt'],
      ['🇳🇬', 'Nigeria'], ['🇦🇺', 'Australia'], ['🇳🇿', 'New Zealand']
    ];
    function randomEmoji(id, choices) {
      const element = document.getElementById(id);
      const alternatives = choices.filter(([emoji]) => emoji !== element.textContent);
      const [emoji, label] = alternatives[Math.floor(Math.random() * alternatives.length)];
      element.textContent = emoji;
      element.setAttribute('aria-label', label);
    }
    function randomizeFooter() {
      randomEmoji('object-emoji', objects);
      randomEmoji('place-emoji', countries);
    }
    randomizeFooter();

    // plaintext-only keeps pasted content as text and preserves native undo.
    // innerText includes line breaks created by contenteditable's block nodes.
    function save() {
      if (editing) sourceText = editor.innerText;
      try {
        localStorage.setItem(storageKey, sourceText);
      } catch (error) {
        // Keep the document usable if browser storage is disabled or full.
        console.warn('Kong could not save text to localStorage.', error);
      }
    }

    try {
      sourceText = localStorage.getItem(storageKey) ?? '';
      editor.textContent = sourceText;
    } catch (error) {
      console.warn('Kong could not restore text from localStorage.', error);
    }
    renderMarkdown(sourceText, reading);

    function setMode(nextEditing) {
      if (editing === nextEditing) return;
      const scrollX = window.scrollX;
      const scrollY = window.scrollY;
      save();
      editing = nextEditing;
      if (!editing) renderMarkdown(sourceText, reading);
      // Show the destination before hiding the current view to avoid collapsing
      // the document and resetting its scroll position during the switch.
      if (editing) {
        editor.hidden = false;
        reading.hidden = true;
      } else {
        reading.hidden = false;
        editor.hidden = true;
      }
      editor.contentEditable = editing ? 'plaintext-only' : 'false';
      editor.setAttribute('aria-readonly', String(!editing));
      button.textContent = editing ? 'Edit' : 'Read';
      button.setAttribute('aria-pressed', String(editing));
      button.title = `Current mode: ${button.textContent}. Click to toggle; hold Ctrl to edit, or use Ctrl+A to stay in Edit.`;
      if (editing) editor.focus({ preventScroll: true });
      else editor.blur();
      window.scrollTo({ left: scrollX, top: scrollY, behavior: 'instant' });
    }

    editor.addEventListener('input', save);
    button.addEventListener('click', () => {
      setMode(!editing);
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Control') {
        if (!event.repeat) {
          if (!ctrlHeld) keepEditingOnRelease = false;
          randomizeFooter();
        }
        ctrlHeld = true;
        setMode(true);
      } else {
        if (event.ctrlKey && event.key.toLowerCase() === 'a' && !event.altKey && !event.metaKey) {
          keepEditingOnRelease = true;
          setMode(true);
        }
      }
    });
    document.addEventListener('keyup', (event) => {
      if (event.key !== 'Control') return;
      // Stay in Edit if the other Ctrl key is still held.
      ctrlHeld = event.ctrlKey;
      if (ctrlHeld) return;
      setMode(keepEditingOnRelease);
      keepEditingOnRelease = false;
    });
    document.addEventListener('wheel', (event) => {
      if (!event.ctrlKey) return;
      event.preventDefault();
      // Wheel deltas can be expressed in pixels, lines, or pages.
      const lineHeight = parseFloat(getComputedStyle(editing ? editor : reading).lineHeight);
      const unit = event.deltaMode === 1 ? lineHeight : event.deltaMode === 2 ? window.innerHeight : 1;
      window.scrollBy({
        left: event.deltaX * unit,
        top: event.deltaY * unit,
        behavior: 'instant'
      });
    }, { passive: false });
    // A release outside the window may not deliver keyup to this page.
    window.addEventListener('blur', () => {
      keepEditingOnRelease = false;
      if (ctrlHeld) {
        ctrlHeld = false;
        setMode(false);
      }
    });
  </script>
</body>
</html>
